# Monitors
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = HDMI-A-2, 3840x2160@160, 1920x0, 1.5


# NVIDIA environment variables
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = PATH,$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH
env = GSK_RENDERER,gl
env = KITTY_ENABLE_WAYLAND,1

# Cursor setup
cursor {
    no_hardware_cursors = true
}

xwayland {
    force_zero_scaling = true
}

# Autostart essential services
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swaybg -i $HOME/.config/hypr/wallpapers/star-wars-padme-amidala-desktop-wallpaper.jpg -m fill
exec-once = waybar
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Input configuration
input {
    kb_layout = latam
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# Misc settings
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# General appearance
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(11111b80)
    }
}

render {
    direct_scanout = false
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 1, myBezier
    animation = windowsOut, 1, 1, default, popin 80%
    animation = border, 1, 1.6, default
    animation = borderangle, 1, 1.6, default
    animation = fade, 1, 1, default
    animation = workspaces, 1, 1, default, slide
}

dwindle {
    preserve_split = true
}

# Keybindings
$mainMod = SUPER

bind = $mainMod, Q, exec, wezterm
bind = $mainMod, RETURN, exec, wezterm
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nemo
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, P, pseudo,

# Screenshot keybindings (copies directly to clipboard for instant pasting)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = SHIFT, Print, exec, grim - | wl-copy -t image/png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy -t image/png

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resize_window

windowrulev2 = float, class:^(hyprland-share-picker)$
windowrulev2 = pin, class:^(hyprland-share-picker)$
windowrulev2 = center, class:^(hyprland-share-picker)$
windowrulev2 = opaque, class:^(google-chrome|chromium|zen|firefox|vlc|mpv|celluloid)$
windowrulev2 = opaque, fullscreen:1
